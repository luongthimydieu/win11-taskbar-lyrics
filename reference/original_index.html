<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Taskbar Sync · 手机端待办控制台</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      max-width: 540px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-top: 6px;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .status-pill {
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .config-panel { display: none; }
    .config-panel.active { display: block; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"], input[type="time"], select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row > * { flex: 1; }
    button {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button:active { transform: scale(0.98); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .add-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 0.82rem;
      border-radius: 10px;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .todo-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.15s;
    }
    .todo-item.done { opacity: 0.55; }
    .todo-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .todo-item.done .checkbox {
      background: var(--success);
      border-color: var(--success);
    }
    .todo-content { flex: 1; min-width: 0; }
    .todo-title {
      font-size: 0.95rem;
      font-weight: 500;
      word-break: break-word;
    }
    .todo-item.done .todo-title { text-decoration: line-through; color: var(--muted); }
    .todo-meta {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      font-size: 0.74rem;
      color: var(--muted);
      align-items: center;
    }
    .badge {
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.7rem;
    }
    .badge.high { background: rgba(244, 63, 94, 0.18); color: var(--danger); }
    .badge.normal { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .del-btn {
      background: transparent;
      color: var(--muted);
      padding: 6px 8px;
      font-size: 0.85rem;
    }
    .del-btn:hover { color: var(--danger); }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 32px 16px;
      font-size: 0.88rem;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #334155;
      color: #fff;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🎵 任务栏待办同步台</h1>
      <p>手机端随时记录 · Win11 任务栏实时轮播与提醒</p>
    </div>
    <div class="status-pill" onclick="toggleConfig()">
      <span class="dot" id="syncDot"></span>
      <span id="syncText">配置云同步</span>
    </div>
  </header>

  <!-- GitHub Gist 配置面板 -->
  <div class="card config-panel" id="configPanel">
    <div class="field">
      <label>GitHub Personal Access Token (仅需勾选 gist 权限)</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
    </div>
    <div class="field">
      <label>Gist ID (留空并点击「初始化」可自动创建新 Gist)</label>
      <input type="text" id="gistId" placeholder="例如：a1b2c3d4e5f6..." />
    </div>
    <div class="row">
      <button onclick="saveConfigAndSync()">保存并同步</button>
      <button class="secondary" onclick="createNewGist()">一键初始化新 Gist</button>
    </div>
  </div>

  <!-- 添加待办表单 -->
  <div class="card">
    <div class="add-form">
      <input type="text" id="todoInput" placeholder="输入今天要做的事（将在电脑任务栏滚动提醒）..." />
      <div class="row">
        <input type="time" id="todoTime" title="电脑端到点闪烁提醒时间（可选）" />
        <select id="todoPriority">
          <option value="normal">普通待办</option>
          <option value="high">🔥 重要且紧急</option>
        </select>
        <button onclick="addTodo()">+ 添加</button>
      </div>
    </div>
  </div>

  <!-- 筛选标签 -->
  <div class="tabs">
    <div class="tab active" id="tab-pending" onclick="setFilter('pending')">待完成 (<span id="count-pending">0</span>)</div>
    <div class="tab" id="tab-all" onclick="setFilter('all')">全部 (<span id="count-all">0</span>)</div>
    <div class="tab" id="tab-done" onclick="setFilter('done')">已完成 (<span id="count-done">0</span>)</div>
  </div>

  <!-- 待办列表 -->
  <div class="todo-list" id="todoList"></div>

  <div class="toast" id="toast">已同步至 GitHub Gist</div>

  <script>
    const GIST_FILENAME = "taskbar_todos.json";
    let todos = [];
    let currentFilter = "pending";

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function toggleConfig() {
      document.getElementById("configPanel").classList.toggle("active");
    }

    function loadLocalConfig() {
      const token = localStorage.getItem("gh_token") || "";
      const gistId = localStorage.getItem("gh_gist_id") || "";
      document.getElementById("ghToken").value = token;
      document.getElementById("gistId").value = gistId;
      const cached = localStorage.getItem("local_todos");
      if (cached) {
        try { todos = JSON.parse(cached); } catch (e) { todos = []; }
      } else {
        todos = [
          { id: "demo-1", text: "下午 3 点提交周报并复盘项目进度", remind_at: "15:00", priority: "high", done: false },
          { id: "demo-2", text: "整理网易云高分乐评歌单", remind_at: "20:00", priority: "normal", done: false }
        ];
      }
      updateStatusIndicator(Boolean(token && gistId));
      renderTodos();
      if (token && gistId) {
        fetchFromGist();
      } else {
        document.getElementById("configPanel").classList.add("active");
      }
    }

    function updateStatusIndicator(isConfigured) {
      const dot = document.getElementById("syncDot");
      const txt = document.getElementById("syncText");
      if (isConfigured) {
        dot.classList.add("online");
        txt.textContent = "已连接 GitHub";
      } else {
        dot.classList.remove("online");
        txt.textContent = "未配置云同步";
      }
    }

    async function createNewGist() {
      const token = document.getElementById("ghToken").value.trim();
      if (!token) {
        showToast("请先填写 GitHub Token");
        return;
      }
      showToast("正在创建私密 Gist...");
      try {
        const res = await fetch("https://api.github.com/gists", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            description: "Win11 Taskbar Lyrics & Todo Sync Data",
            public: false,
            files: {
              [GIST_FILENAME]: {
                content: JSON.stringify({ updated_at: new Date().toISOString(), todos }, null, 2)
              }
            }
          })
        });
        if (!res.ok) throw new Error("创建失败，请检查 Token 权限");
        const data = await res.json();
        document.getElementById("gistId").value = data.id;
        localStorage.setItem("gh_token", token);
        localStorage.setItem("gh_gist_id", data.id);
        updateStatusIndicator(true);
        showToast("创建成功！请复制 Gist ID 到电脑端");
      } catch (err) {
        showToast(err.message);
      }
    }

    async function saveConfigAndSync() {
      const token = document.getElementById("ghToken").value.trim();
      const gistId = document.getElementById("gistId").value.trim();
      localStorage.setItem("gh_token", token);
      localStorage.setItem("gh_gist_id", gistId);
      updateStatusIndicator(Boolean(token && gistId));
      document.getElementById("configPanel").classList.remove("active");
      if (token && gistId) {
        await fetchFromGist();
      }
    }

    async function fetchFromGist() {
      const token = localStorage.getItem("gh_token");
      const gistId = localStorage.getItem("gh_gist_id");
      if (!token || !gistId) return;
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json"
          }
        });
        if (!res.ok) throw new Error("拉取 Gist 失败");
        const data = await res.json();
        if (data.files && data.files[GIST_FILENAME]) {
          const parsed = JSON.parse(data.files[GIST_FILENAME].content);
          if (Array.isArray(parsed.todos)) {
            todos = parsed.todos;
            localStorage.setItem("local_todos", JSON.stringify(todos));
            renderTodos();
            showToast("已从云端同步最新待办");
          }
        }
      } catch (e) {
        showToast("云端拉取失败，当前使用本地缓存");
      }
    }

    async function pushToGist() {
      localStorage.setItem("local_todos", JSON.stringify(todos));
      const token = localStorage.getItem("gh_token");
      const gistId = localStorage.getItem("gh_gist_id");
      if (!token || !gistId) {
        showToast("已保存在本地（配置 GitHub 后可跨端同步）");
        return;
      }
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: "PATCH",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            files: {
              [GIST_FILENAME]: {
                content: JSON.stringify({ updated_at: new Date().toISOString(), todos }, null, 2)
              }
            }
          })
        });
        if (!res.ok) throw new Error("同步失败");
        showToast("☁️ 已同步至电脑端任务栏");
      } catch (e) {
        showToast("同步至 GitHub 失败，请检查网络或 Token");
      }
    }

    function addTodo() {
      const input = document.getElementById("todoInput");
      const timeInput = document.getElementById("todoTime");
      const priorityInput = document.getElementById("todoPriority");
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({
        id: "todo-" + Date.now(),
        text,
        remind_at: timeInput.value || "",
        priority: priorityInput.value,
        done: false
      });
      input.value = "";
      timeInput.value = "";
      renderTodos();
      pushToGist();
    }

    function toggleDone(id) {
      const item = todos.find(t => t.id === id);
      if (item) {
        item.done = !item.done;
        renderTodos();
        pushToGist();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      renderTodos();
      pushToGist();
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
      document.getElementById("tab-" + f).classList.add("active");
      renderTodos();
    }

    function renderTodos() {
      const list = document.getElementById("todoList");
      const pendingCount = todos.filter(t => !t.done).length;
      const doneCount = todos.filter(t => t.done).length;
      document.getElementById("count-pending").textContent = pendingCount;
      document.getElementById("count-all").textContent = todos.length;
      document.getElementById("count-done").textContent = doneCount;

      const filtered = todos.filter(t => {
        if (currentFilter === "pending") return !t.done;
        if (currentFilter === "done") return t.done;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">暂无待办事项 ✨</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => `
        <div class="todo-item ${item.done ? 'done' : ''}">
          <div class="todo-left" onclick="toggleDone('${item.id}')">
            <div class="checkbox">${item.done ? '✓' : ''}</div>
            <div class="todo-content">
              <div class="todo-title">${escapeHtml(item.text)}</div>
              <div class="todo-meta">
                <span class="badge ${item.priority}">${item.priority === 'high' ? '🔥 紧急' : '待办'}</span>
                ${item.remind_at ? `<span>⏰ ${item.remind_at} 电脑提醒</span>` : '<span>🔄 任务栏轮播</span>'}
              </div>
            </div>
          </div>
          <button class="del-btn" onclick="deleteTodo('${item.id}')">✕</button>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    loadLocalConfig();
  </script>
</body>
</html>
